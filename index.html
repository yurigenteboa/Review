    <!-- Aparência escolhida pela pessoa, aplicada antes da primeira pintura (sem piscar).
         Espelho mínimo de src/lib/appearance.ts: se mudar atributos ou chaves lá, mude aqui. -->
    <script>
      (function () {
        try {
          var d = document.documentElement, m = function (q) { return matchMedia(q).matches }
          var a = JSON.parse(localStorage.getItem('mmisc.aparencia') || '{}')
          var css = JSON.parse(localStorage.getItem('mmisc.aparencia.css') || 'null')
          var steps = [0.85, 1, 1.15, 1.3, 1.45, 1.6]
          var tema = !a.tema || a.tema === 'auto' ? (m('(prefers-color-scheme: dark)') ? 'escuro' : 'claro') : a.tema
          var pick = function (v, auto, yes, no) { return !v || v === 'auto' ? (m(auto) ? yes : no) : v }
          d.setAttribute('data-estilo', a.estilo || 'vidro')
          d.setAttribute('data-tema', tema)
          d.setAttribute('data-contraste', pick(a.contraste, '(prefers-contrast: more)', 'alto', 'normal'))
          d.setAttribute('data-transp', pick(a.transp, '(prefers-reduced-transparency: reduce)', 'solido', 'vidro'))
          d.setAttribute('data-movimento', pick(a.movimento, '(prefers-reduced-motion: reduce)', 'reduzido', 'completo'))
          d.setAttribute('data-densidade', a.densidade || 'confortavel')
          d.setAttribute('data-categorias', a.categorias || 'coloridas')
          d.setAttribute('data-fonte', a.fonte || 'inter')
          d.setAttribute('data-nota', a.nota || 'estrelas')
          d.setAttribute('data-vibracao', a.vibracao === false ? 'off' : 'on')
          if (typeof a.texto === 'number' && steps[a.texto]) d.style.setProperty('--escala-texto', String(steps[a.texto]))
          else if (window.CSS && CSS.supports('font', '-apple-system-body')) {
            var p = document.createElement('span'); p.style.font = '-apple-system-body'; d.appendChild(p)
            var px = parseFloat(getComputedStyle(p).fontSize); p.remove()
            if (px > 0) d.style.setProperty('--escala-texto', String(Math.min(1.6, Math.max(0.85, px / 17))))
          }
          if (css && css[tema]) for (var k in css[tema]) d.style.setProperty(k, css[tema][k])
          var bg = { claro: '#F2F2F7', medio: '#1E2127', escuro: '#000000', preto: '#000000' }[tema]
          var est = { acrilico: ['#F3F3F3', '#202020'], anos90: ['#C0C0C0', '#000000'], console: ['#E8EDF5', '#06102A'], portatil: ['#EBEBEB', '#2D2D2D'] }[a.estilo]
          if (est) bg = tema === 'claro' ? est[0] : est[1]
          if (bg) document.querySelector('meta[name="theme-color"]').content = bg
        } catch (e) {
          document.documentElement.setAttribute('data-tema', matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro')
        }
      })()
    </script>
